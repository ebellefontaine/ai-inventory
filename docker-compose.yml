services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiinv
      POSTGRES_PASSWORD: aiinv
      POSTGRES_DB: aiinv
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiinv"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
